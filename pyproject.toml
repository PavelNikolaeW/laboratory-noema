[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-lab-client"
version = "0.1.0"
description = "Public async transport client for the Noema research laboratory"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1"]

[tool.setuptools]
packages = ["sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
